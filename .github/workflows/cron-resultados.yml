name: Cron — resultados

# Sincroniza os resultados das loterias e, de quebra, mantém o projeto Supabase Free
# ativo (ele pausa após 7 dias sem atividade) — seções 3 (ADR-07) e 10.4.
#   22h30 BRT (01h30 UTC): depois dos sorteios da noite
#   09h00 BRT (12h00 UTC): repescagem, caso a API da CAIXA tenha falhado à noite
on:
  schedule:
    - cron: '30 1 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: cron-resultados
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: producao
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A CAIXA bloqueia a nuvem do Supabase (pendência P4): o runner busca os resultados
      # e os entrega à function; se a CAIXA bloquear o runner também, a function usa a API
      # alternativa. O log tem só contagens e o resumo por modalidade (sem dados de usuários).
      - name: Buscar na CAIXA e sincronizar
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
        run: node scripts/buscar-resultados-caixa.mjs
