name: Cron — resultados

# Sincronização de resultados (seção 10.4). Também evita que o projeto Supabase gratuito
# pause por inatividade.
#
# O GitHub atrasa execuções agendadas (em nov/2026, as das 01h30 e 12h00 UTC rodavam
# ~7 h depois). Por isso há vários horários, em minutos "quebrados" (fora do pico da hora
# cheia), cobrindo a noite dos sorteios (~20h BRT) e a manhã seguinte. Rodar a mais é
# inofensivo: a sincronização é idempotente e leva ~20 s.
on:
  schedule:
    - cron: '41 0 * * *' # 21h41 BRT
    - cron: '13 2 * * *' # 23h13 BRT
    - cron: '7 6 * * *' # 03h07 BRT
    - cron: '37 11 * * *' # 08h37 BRT
  workflow_dispatch:

concurrency:
  group: cron-resultados
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: producao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Buscar na CAIXA e sincronizar
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
        run: node scripts/buscar-resultados-caixa.mjs

  # Em repositório público, o GitHub DESATIVA workflows agendados após 60 dias sem
  # atividade no repositório. Reativar os workflows agendados pela API zera esse prazo,
  # sem commits.
  manter-ativo:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Reativar os workflows agendados (zera o prazo de 60 dias)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in cron-resultados.yml backup-banco.yml; do
            gh api --method PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
