name: Backup do banco

# Backup mensal da produção (seção 16, pendência P6). O plano Free do Supabase não garante
# backups utilizáveis. O dump é CIFRADO (AES-256, gpg simétrico) antes de virar artefato:
# o repositório é público e os artefatos podem ser baixados por terceiros. Sem o secret
# BACKUP_PASSPHRASE o job falha antes de ler o banco; nada sai sem cifra.
#
# Restaurar: baixe o artefato, rode
#   gpg --decrypt lotogestor-AAAA-MM-DD.tar.gz.gpg | tar -xz
# e aplique roles.sql, schema.sql e data.sql nessa ordem (docs/ci-cd.md, seção 3.5).
on:
  schedule:
    - cron: '23 7 1 * *' # dia 1 de cada mês, 04h23 BRT
  workflow_dispatch:

concurrency:
  group: backup-banco
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Senha do backup configurada
        run: |
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "::error::Defina o secret BACKUP_PASSPHRASE (20+ caracteres) no environment producao."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          sparse-checkout: supabase

      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Dump (papéis, schema e dados)
        run: |
          mkdir -p "$RUNNER_TEMP/backup"
          cd "$RUNNER_TEMP/backup"
          supabase db dump --linked --role-only -f roles.sql
          supabase db dump --linked -f schema.sql
          supabase db dump --linked --data-only --use-copy -f data.sql
          ls -l

      - name: Compactar e cifrar
        id: cifrar
        run: |
          nome="lotogestor-$(date -u +%F)"
          cd "$RUNNER_TEMP/backup"
          tar -czf "$nome.tar.gz" roles.sql schema.sql data.sql
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$nome.tar.gz.gpg" "$nome.tar.gz"
          rm -f roles.sql schema.sql data.sql "$nome.tar.gz"
          echo "nome=$nome" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.cifrar.outputs.nome }}
          path: ${{ runner.temp }}/backup/${{ steps.cifrar.outputs.nome }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
