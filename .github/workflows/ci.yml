name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Três jobs em paralelo: verificações (lint, unitários, banco, build) e o E2E dividido entre
# os dois viewports, cada um com o seu Supabase local. Antes era um job só, em série
# (~8–10 min, dos quais 5–6,5 min de E2E contra o `vite dev`). O job `ci` no fim é o
# status check exigido pela proteção da main (.github/rulesets/protecao-main.json).
#
# Actions fixadas pelo SHA do commit da versão (tags podem ser movidas); a versão fica no
# comentário. Para atualizar: escolha a release estável, resolva o SHA da tag e troque os dois.
jobs:
  verificacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # 1. Dependências
      - run: pnpm install --frozen-lockfile

      # 2. Lint, formatação e tipos
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Cópia do shared para as Edge Functions está em dia
        run: pnpm sync:shared:check

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Tipos das Edge Functions
        working-directory: supabase/functions
        run: deno check --config deno.json */index.ts tests/*.ts

      # 3. Testes unitários (shared com cobertura ≥ 90% + web)
      - run: pnpm test:coverage
      - run: pnpm --filter @lotogestor/web test

      # 4. Banco: migrations + seed (aplicados pelo `start`), pgTAP e lint do schema
      - name: Supabase local
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare
      - run: pnpm exec supabase test db
      - run: pnpm exec supabase db lint --level warning --fail-on error
      - name: Testes das Edge Functions (API da CAIXA simulada)
        working-directory: supabase/functions
        run: deno test --allow-net --allow-env --allow-read tests/

      # 5. Tipos gerados do banco estão atualizados
      - name: Tipos do banco em dia
        run: |
          pnpm gen:types
          git diff --exit-code apps/web/src/types/database.ts

      # 6. Build (e nenhuma chave secreta no bundle — Apêndice C)
      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      - name: Bundle inicial < 250 KB gzip (seção 16)
        run: node scripts/tamanho-bundle.mjs 250
      - name: Nenhuma chave secreta no bundle
        run: |
          # O supabase-js contém o PREFIXO "sb_secret_" (para reconhecer chaves); procuramos
          # uma chave de fato (prefixo + valor) ou o papel service_role em texto.
          if grep -rE "sb_secret_[A-Za-z0-9_-]{16,}|service_role" apps/web/dist; then
            echo "Chave secreta encontrada no bundle!"; exit 1
          fi

  # 7. E2E (Playwright) contra o BUILD de produção e o Supabase local, um job por viewport
  #    (360×800 e 1280×800). Os testes mexem em dados globais (limite de usuários ativos,
  #    resultados lançados pelo admin): por isso cada viewport tem o seu banco, e não
  #    vários workers no mesmo.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        projeto: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O E2E não usa o Studio nem o postgres-meta (só o `gen:types`, no outro job).
      - name: Supabase local
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,postgres-meta

      - name: Build
        run: pnpm --filter @lotogestor/web build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH

      - run: pnpm --filter @lotogestor/web exec playwright install --with-deps chromium
      - name: Playwright (${{ matrix.projeto }})
        working-directory: apps/web
        run: |
          printf 'VITE_SUPABASE_URL=http://127.0.0.1:54321\nVITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH\n' > .env.local
          pnpm test:e2e --project=${{ matrix.projeto }}
        env:
          CI: true
          E2E_PREVIEW: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.projeto }}
          path: apps/web/test-results
          retention-days: 7

  # Status check exigido pela proteção da main: passa só se todos os jobs acima passaram.
  ci:
    if: always()
    needs: [verificacoes, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Todos os jobs passaram
        run: |
          echo "verificacoes=${{ needs.verificacoes.result }} e2e=${{ needs.e2e.result }}"
          test "${{ needs.verificacoes.result }}" = success
          test "${{ needs.e2e.result }}" = success
