<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F2F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101120" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Gerenciador pessoal de apostas das Loterias CAIXA" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="LotoGestor" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>LotoGestor</title>
    <!-- Aplica o tema salvo antes do primeiro paint (evita "flash" claro no modo escuro).
         Script externo porque a CSP proíbe script inline. -->
    <script src="/tema-inicial.js"></script>
  </head>
  <body>
    <!-- Abertura estática: aparece antes do JS (primeiro paint rápido no 4G) e o React
         a substitui ao montar. Mesma marca de <Logo />, só com classes (a CSP não deixa
         estilo inline). -->
    <div id="root">
      <div class="flex min-h-dvh items-center justify-center" role="status">
        <span
          class="inline-flex items-center gap-2 font-display text-3xl font-semibold tracking-tight"
        >
          <svg viewBox="0 0 64 64" class="size-[1.4em] shrink-0" aria-hidden="true">
            <rect width="64" height="64" rx="16" class="fill-tinta" />
            <circle cx="32" cy="32" r="18" class="fill-tinta-foreground" />
            <circle cx="32" cy="32" r="8" class="fill-destaque" />
          </svg>
          <span>LotoGestor</span>
        </span>
        <span class="sr-only">Carregando…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
